name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── İstemci: derleme + birim + tarayıcı testleri (mevcut akış) ──────────
  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bağımlılıklar
        run: npm install --no-fund --no-audit
      - name: Playwright tarayıcısı
        run: npx playwright install chromium --with-deps
      - name: Derle
        run: python3 build.py
      - name: Derleme çıktısını doğrula
        run: |
          test -f dist/index.html
          grep -q "APP_VERSION" dist/index.html
      - name: Testleri çalıştır (birim + E2E)
        run: node --test tests/

  # ── Sunucu: üyelik / ödeme / duvar API testleri ─────────────────────────
  api:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arlo
          POSTGRES_PASSWORD: arlo_ci_password
          POSTGRES_DB: arlo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arlo -d arlo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      # Görsel deposu. S3Mock S3 API'sini birebir uygular; presigned URL
      # üretimi ve görsel bağlama testleri ancak depo varken anlamlı.
      # (Üretimde MinIO kullanılır; CI'da imaja erişim sorunu olmasın.)
      storage:
        image: adobe/s3mock:latest
        env:
          # S3 bucket adı: alt çizgi GİÇERSİZDİR (InvalidBucketName) ve
          # postgres veritabanı adıyla karışmasın diye ayrı tutulur.
          initialBuckets: arlo-ci-gorseller
          compatibility: default
        ports:
          - 9090:9090
        # S3Mock imajında ne curl ne node var; sağlık kontrolü konteyner
        # içinde çalışamaz. Bu yüzden bekleme aşağıdaki "Depo hazır olsun"
        # adımında, job'ın kendi Node'u ile yapılıyor.
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://arlo:arlo_ci_password@localhost:5432/arlo_test
      APP_ORIGIN: http://localhost:8000
      # Görsel deposu (S3Mock, 9090). Stripe yok: ödeme testleri bunu
      # "yapılandırılmamış" kabul eder ve webhook imzası kendi sırrıyla çalışır.
      S3_ENDPOINT: http://localhost:9090
      S3_ACCESS_KEY_ID: arlo
      S3_SECRET_ACCESS_KEY: arlo_ci_password
      S3_BUCKET: arlo-ci-gorseller
      S3_FORCE_PATH_STYLE: "true"
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bağımlılıklar
        run: npm install --no-fund --no-audit
      - name: Prisma istemcisi
        run: npx prisma generate
      - name: Migration'ları uygula
        run: npx prisma migrate deploy
      - name: "Depo hazır olsun"
        run: |
          for i in $(seq 1 30); do
            if node -e "fetch('http://localhost:9090').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" 2>/dev/null; then
              echo "S3Mock hazır"; exit 0
            fi
            sleep 2
          done
          echo "S3Mock 60 saniyede hazır olmadı"; exit 1
      - name: Sunucu testleri
        run: node --test --test-concurrency=1 tests/