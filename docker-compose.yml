# ─────────────────────────────────────────────────────────────
# Arduino Rüya Atölyesi — yerel/VDS ortamı
#
# VDS'te bu dosya aynen kullanılır; sadece DOMAIN ve üretim parolaları değişir.
# Çoklu proje izolasyonu:
#   • container_name HİÇ kullanılmaz — adlar compose proje adından gelir
#     (docker compose -p arlo up -d → arlo-db-1, arlo-api-1 ...)
#   • Servisler sadece loopback'e bağlanır, 80/443 sadece Traefik'te
#   • Volume'lar ve bucket adı proje önekli
#
# Kullanım:
#   cp server/.env.example server/.env   (parolaları değiştir)
#   docker compose -p arlo up -d --build
#   docker compose -p arlo --profile dev up -d studio   # Prisma Studio
#   docker compose -p arlo --profile dev run --rm test  # sunucu testleri
# ─────────────────────────────────────────────────────────────
name: arlo

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: arlo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arlo_dev_password}
      POSTGRES_DB: arlo_db
    volumes:
      - arlo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arlo -d arlo_db"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Host'a port AÇILMAZ. Sadece ağ içinden (api konteyneri) erişilir.

  # Testler siler/ekler; üretim verisiyle karışmasın diye ayrı veritabanı.
  db-init:
    image: postgres:16-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-arlo_dev_password}
    entrypoint: >
      /bin/sh -c "psql -h db -U arlo -d arlo_db -tAc \"SELECT 1 FROM pg_database WHERE datname='arlo_test'\" | grep -q 1
      || createdb -h db -U arlo arlo_test; echo 'arlo_test hazir'"
    restart: "no"

  storage:
    image: quay.io/minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-arlo}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-arlo_dev_password}
    volumes:
      - arlo_minio:/data
    ports:
      # Sadece konsol, sadece loopback
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      storage:
        condition: service_started
    env_file:
      - server/.env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://arlo:${POSTGRES_PASSWORD:-arlo_dev_password}@db:5432/arlo_db
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-arlo}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-arlo_dev_password}
      S3_BUCKET: ${S3_BUCKET:-arlo-gorseller}
      S3_FORCE_PATH_STYLE: "true"
    command: sh -c "npx prisma migrate deploy && node src/index.js"
    ports:
      - "127.0.0.1:${API_PORT:-4021}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.arlo.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.arlo.entrypoints=websecure"
      - "traefik.http.routers.arlo.tls.certresolver=letsencrypt"
      - "traefik.http.services.arlo.loadbalancer.server.port=3000"

  # Yalnız geliştirme: docker compose -p arlo --profile dev up -d studio
  # UYARI: Prisma Studio yayınlanmada da erişilebilir kalır. VDS'te
  # profile'ı kullanmayın ya da proxy'ye basic auth ekleyin.
  studio:
    image: node:20-alpine
    profiles: ["dev"]
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app
      - arlo_studio_modules:/app/node_modules
    environment:
      DATABASE_URL: postgresql://arlo:${POSTGRES_PASSWORD:-arlo_dev_password}@db:5432/arlo_db
    command: >
      sh -c "apk add --no-cache openssl >/dev/null &&
             npm install --no-fund --no-audit &&
             npx prisma generate &&
             npx prisma studio --port 5555 --hostname 0.0.0.0"
    ports:
      - "127.0.0.1:5555:5555"

  # Yalnız geliştirme: docker compose -p arlo --profile dev run --rm test
  # arlo_test veritabanını kullanır; tabloları testler temizler.
  test:
    image: node:20-alpine
    profiles: ["dev"]
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      storage:
        condition: service_started
    volumes:
      - ./server:/app
      - arlo_test_modules:/app/node_modules
    environment:
      NODE_ENV: test
      APP_ORIGIN: http://localhost:8000
      DATABASE_URL: postgresql://arlo:${POSTGRES_PASSWORD:-arlo_dev_password}@db:5432/arlo_test
      S3_ENDPOINT: http://storage:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-arlo}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-arlo_dev_password}
      S3_BUCKET: ${S3_BUCKET:-arlo-gorseller}
      S3_FORCE_PATH_STYLE: "true"
    command: >
      sh -c "apk add --no-cache openssl >/dev/null &&
             npm install --no-fund --no-audit &&
             npx prisma generate &&
             npx prisma migrate reset --force --skip-seed &&
             node --test --test-concurrency=1 tests/"

volumes:
  arlo_pgdata:
  arlo_minio:
  arlo_studio_modules:
  arlo_test_modules: