name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# v3.1.0: Birim ve tarayıcı testleri tek komutta birleşti (node --test tests/).
# Tarayıcı testleri tests/e2e.test.js içinde aynı koşuya giriyor.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Bağımlılıklar
        run: npm install --no-fund --no-audit
      - name: Playwright tarayıcısı
        run: npx playwright install chromium --with-deps
      - name: Derle
        run: python3 build.py
      - name: Derleme çıktısını doğrula
        run: |
          test -f dist/index.html
          grep -q "APP_VERSION" dist/index.html
      # Birim testleri (tests/core.test.js) + tarayıcı senaryoları (tests/e2e.test.js)
      - name: Testleri çalıştır (birim + E2E)
        run: node --test tests/